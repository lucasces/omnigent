# Curated read-only shell command presets for
# omnigent.policies.builtins.shell_readonly.allow_read_only_shell.
#
# Each preset is a list of command patterns; each pattern is a list of
# literal tokens matched as a prefix against the real (wrapper-stripped)
# invocation, e.g. [git, status] matches `git status -s` but not `git stash`.
#
# Ported from, and deliberately narrower than, xtga/agtx's
# permissions/*.toml presets: only commands that cannot mutate the
# filesystem, mutate the network, or execute arbitrary code are included.
#
# `find`, `sed`, and `awk` are guarded entries: a mapping with `pattern` and
# `guard` instead of a plain token list. Unlike a plain entry, a prefix
# match alone is NOT sufficient — a CEL expression (see `_compile_guard` /
# `_GUARD_FACT_EXTRACTORS` in shell_readonly.py) is evaluated against the
# full argv (and, for sed/awk, Python-derived facts about the script-text
# operand) and must return `false` (not dangerous) for the command to be
# allowed. This exists because these three commands' write/exec vectors
# (`-exec`/`-delete`, `-i`/embedded `w`·`e`, `system()`/redirects) are not
# confined to a fixed prefix position — see
# docs/shell-readonly-allowlist-audit.md §5-§6 for why a plain prefix
# pattern cannot do this safely. Residual risk (enumeration gaps, shell
# expansion, regex heuristics over script text) is documented at
# `_GUARD_FACT_EXTRACTORS` and is NOT eliminated, only mitigated with an
# ASK fallback on anything ambiguous.
#
# Excluded on purpose, even where agtx allows them:
#   - core: rm, mv, cp, mkdir (mutate the filesystem)
#   - git: add, commit, push, merge, checkout, stash, branch (all mutate
#     the repo or working tree; `branch` can delete/rename with -d/-D/-m)
#   - node: bare `node` (runs arbitrary scripts), npm/yarn install/run/build
#     (install or run arbitrary package scripts)
#   - python: pip install, python -m black (rewrites files without --check)
#   - rust: cargo build (writes build artifacts + fetches deps), cargo fmt
#     (rewrites files without --check)
#   - docker/k8s: build, run, compose, apply, delete (create/mutate resources)
#   - nix: nix build (writes the store), nixos-rebuild (mutates the system)
#   - terraform: init (fetches providers/modules), apply/destroy/import
#     (mutate real infrastructure), fmt (rewrites files without -check),
#     state mv/rm/push, taint/untaint, workspace new/delete

core:
  description: Core read-only shell utilities (no filesystem or network mutation)
  commands:
    - [cat]
    - [ls]
    - [head]
    - [tail]
    - [wc]
    - [echo]
    - [grep]
    - [sort]
    - [uniq]
    - [diff]
    - [which]
    - [env]
    - [pwd]
    - pattern: [find]
      guard: >-
        tokens.exists(t, t in ["-exec", "-execdir", "-ok", "-okdir",
        "-delete", "-fprintf", "-fprint", "-fprint0", "-fls"])
    - pattern: [sed]
      guard: >-
        facts.has_inplace || facts.has_external_script ||
        facts.has_write_command || facts.has_execute_flag
    - pattern: [awk]
      guard: >-
        facts.has_inplace || facts.has_external_script ||
        facts.has_redirect || facts.has_system_call

git:
  description: Read-only git inspection commands
  commands:
    - [git, status]
    - [git, diff]
    - [git, log]
    - [git, show]

node:
  description: Read-only Node.js project commands
  commands:
    - [npm, test]
    - [npm, ls]
    - [yarn, test]

python:
  description: Read-only Python project commands
  commands:
    - [pytest]
    - [python, -m, pytest]
    - [pip, list]
    - [python, -m, mypy]

rust:
  description: Read-only Rust project commands
  commands:
    - [cargo, test]
    - [cargo, check]
    - [cargo, clippy]

docker:
  description: Read-only Docker inspection commands
  commands:
    - [docker, ps]
    - [docker, logs]

k8s:
  description: Read-only Kubernetes inspection commands
  commands:
    - [kubectl, get]
    - [kubectl, describe]
    - [kubectl, logs]

nix:
  description: Read-only Nix evaluation/check commands
  commands:
    - [nix, flake, check]
    - [nix, eval]

terraform:
  description: Read-only Terraform/OpenTofu inspection commands
  commands:
    - [terraform, plan]
    - [terraform, validate]
    - [terraform, show]
    - [terraform, output]
    - [terraform, graph]
    - [terraform, version]
    - [terraform, providers]
    - [terraform, state, list]
    - [terraform, state, show]
    - [tofu, plan]
    - [tofu, validate]
    - [tofu, show]
    - [tofu, output]
    - [tofu, graph]
    - [tofu, version]
    - [tofu, providers]
    - [tofu, state, list]
    - [tofu, state, show]
